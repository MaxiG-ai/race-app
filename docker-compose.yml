services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: race
      POSTGRES_PASSWORD: race
      POSTGRES_DB: race
    ports:
      - "5432:5432"
    volumes:
      - race_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U race"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  race_pgdata:
