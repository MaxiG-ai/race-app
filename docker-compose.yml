# Local and self-hosted instances: `docker compose up`, then
#   docker compose exec app python -m app.cli create-owner
# and open http://localhost:8000. For a public site on your own domain, add
# docker-compose.public.yml (see docs/operations/deployment.md).

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-race}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-race}
    ports:
      - "${APP_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-race}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-race}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-race}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Never publishes a host port.

volumes:
  pgdata:
  uploads:
