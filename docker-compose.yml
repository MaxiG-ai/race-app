# Local development stack: `docker compose up`.
#
# Brings up Postgres, the API (uvicorn --reload) and the Vite dev server, with
# both source trees bind-mounted so edits reload in place — no rebuild, and no
# uv/Node needed on the host. Migrations run automatically before the API
# serves, so a fresh clone is one command.
#
#   API       http://localhost:8000  (docs at /docs)
#   Frontend  http://localhost:5173
#
# Create your account once the stack is up (registration is deliberately closed,
# §2 — the CLI is the only path):
#
#   docker compose exec backend python -m app.cli create-user --email you@example.com
#
# Production is a separate file: docker-compose.prod.yml (see README).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: race
      POSTGRES_PASSWORD: race
      POSTGRES_DB: race
    ports:
      # Published so host tools (psql, the native `uv run pytest` workflow) can
      # reach it. Production deliberately does not — see docker-compose.prod.yml.
      - "5432:5432"
    volumes:
      - race_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U race"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      # `db` is the compose service name; the host default in app/config.py stays
      # localhost so the native `uv run uvicorn` workflow keeps working.
      DATABASE_URL: postgresql+psycopg://race:race@db:5432/race
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    volumes:
      # Live source. The venv is at /opt/venv inside the image, so this mount
      # can't shadow it (see backend/Dockerfile, stage `dev`).
      - ./backend:/app
      # Retained FIT originals land on the host, where they're gitignored (§8).
      - ./backend/var/uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    working_dir: /app
    # `npm install` on start rather than in a build stage: node_modules lives in
    # a named volume (below), so it persists between runs and installs only when
    # package.json actually changed.
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Anonymous-style named volume so the container's Linux-built node_modules
      # is never overwritten by the host's macOS-built one through the mount above.
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  race_pgdata:
  frontend_node_modules:
