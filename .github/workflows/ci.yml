# Lint and tests on every pull request and on pushes to main (docs/operations/deployment.md#ci).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: race
          POSTGRES_PASSWORD: race
          POSTGRES_DB: race
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U race" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://race:race@localhost:5432/race
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No build step and no package.json: this only proves every module parses.
      - name: Syntax-check every ES module
        run: for f in frontend/static/js/*.js; do node --check "$f" || exit 1; done
