# Development: source bind-mounted with auto-reload.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-dir /app/frontend"
    volumes:
      - ./backend/app:/app/backend/app
      - ./frontend:/app/frontend
