[project]
name = "race-app"
version = "2.0.0"
requires-python = ">=3.12"
# Every runtime package is justified in docs/architecture.md#dependency-policy.
dependencies = [
    "alembic>=1.19",
    "argon2-cffi>=25.1",
    "fastapi>=0.115",
    "fitdecode>=0.11",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0",
    "timezonefinder>=8.2",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "fit-tool>=0.9",
    "httpx>=0.28",
    "pytest>=9.0",
    "ruff>=0.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# starlette nudges towards httpx2; httpx is what FastAPI's TestClient documents today
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
